<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Chatbot</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <style>
        /* --- IMPROVEMENT: Using CSS variables for easier theming and maintenance --- */
        :root {
            --primary-bg: #f9f9f9;
            --secondary-bg: #ffffff;
            --header-gradient: linear-gradient(135deg, #2c3e50, #4ca1af);
            --user-msg-gradient: linear-gradient(135deg, #2c3e50, #4ca1af);
            --bot-msg-bg: #e8f5ff;
            --text-light: #ffffff;
            --text-dark: #2c3e50;
            --text-muted: #6c757d;
            --accent-color: #4ca1af;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --border-color: #e0e0e0;
        }

        body, html {
            height: 100%;
            margin: 0;
            background: linear-gradient(135deg, #1a2a6c, #3a6186, #89253e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- IMPROVEMENT: Using flexbox for a fully responsive layout that fills the screen --- */
        .chat-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 15px;
        }

        .card {
            height: 90vh; /* Responsive height */
            max-height: 700px;
            width: 100%;
            border-radius: 20px !important;
            background-color: var(--secondary-bg) !important;
            box-shadow: 0 15px 35px var(--shadow-color);
            display: flex;
            flex-direction: column; /* Ensures footer stays at the bottom */
        }

        .card-header {
            border-radius: 20px 20px 0 0 !important;
            border-bottom: 0 !important;
            background: var(--header-gradient);
            color: var(--text-light);
            padding: 15px 20px;
        }

        /* --- IMPROVEMENT: Refactored styles to be more concise and removed !important --- */
        .user_info span {
            font-size: 20px;
            font-weight: 600;
        }

        .user_info p {
            font-size: 12px;
            opacity: 0.8;
            margin: 0;
        }

        .img_cont {
            height: 50px;
            width: 50px;
        }

        .user_img {
            height: 100%;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .online_icon {
            position: absolute;
            height: 12px;
            width: 12px;
            background-color: #4cd137;
            border-radius: 50%;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--secondary-bg);
        }

        /* --- IMPROVEMENT: Core chat body now uses flex-grow to take all available space --- */
        .msg_card_body {
            flex-grow: 1; /* This is key for the flexible layout */
            overflow-y: auto;
            padding: 20px;
            background-color: var(--primary-bg);
        }

        /* Message container base style */
        .msg_container {
            padding: 10px 18px;
            border-radius: 20px;
            max-width: 75%;
            position: relative;
            margin-bottom: 25px; /* Space for timestamp */
        }

        .msg_container_send {
            background: var(--user-msg-gradient);
            color: var(--text-light);
            border-bottom-right-radius: 5px;
        }

        .msg_container_bot {
            background-color: var(--bot-msg-bg);
            color: var(--text-dark);
            border-bottom-left-radius: 5px;
        }

        .msg_time {
            position: absolute;
            bottom: -20px;
            font-size: 10px;
            color: var(--text-muted);
            width: 100%;
        }

        .msg_time_send {
            right: 5px;
            text-align: right;
        }

        .msg_time_bot {
            left: 5px;
            text-align: left;
        }
        
        .user_img_msg {
            height: 40px;
            width: 40px;
            border: 2px solid var(--border-color);
        }

        /* Welcome Message & Suggestion Chips */
        .welcome-message {
            text-align: center;
            padding: 15px;
            background-color: var(--bot-msg-bg);
            border-radius: 15px;
            margin: 0 auto 20px auto;
            color: var(--text-dark);
            border-left: 4px solid var(--accent-color);
            max-width: 95%;
        }
        
        /* --- NEW FEATURE: Suggestion chips for better UX --- */
        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px 15px 10px;
        }

        .chip {
            background-color: var(--secondary-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 16px;
            margin: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease-in-out;
        }

        .chip:hover {
            background-color: var(--accent-color);
            color: var(--text-light);
            transform: translateY(-2px);
        }

        .card-footer {
            border-radius: 0 0 20px 20px !important;
            border-top: 1px solid var(--border-color) !important;
            padding: 15px;
            background: var(--secondary-bg);
        }

        .type_msg {
            background-color: var(--primary-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-dark) !important;
            height: 50px !important;
            border-radius: 25px !important;
            padding: 0 20px;
        }

        .type_msg:focus {
            box-shadow: 0 0 0 0.2rem rgba(76, 161, 175, 0.25) !important;
            border-color: var(--accent-color) !important;
            outline: none;
        }

        .send_btn {
            border-radius: 50% !important;
            background: var(--header-gradient) !important;
            color: var(--text-light) !important;
            cursor: pointer;
            width: 50px;
            height: 50px;
            transition: transform 0.2s ease;
        }

        .send_btn:hover {
            transform: scale(1.1);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none; /* Initially hidden */
            align-items: center;
            margin-bottom: 10px;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            margin: 0 2px;
            background-color: var(--accent-color);
            display: block;
            border-radius: 50%;
            opacity: 0.4;
            animation: typing 1.2s infinite;
        }

        .typing-indicator span:nth-of-type(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-of-type(3) { animation-delay: 0.4s; }

        @keyframes typing {
            50% { opacity: 1; transform: translateY(-3px); }
        }

        /* Scrollbar styling */
        .msg_card_body::-webkit-scrollbar { width: 6px; }
        .msg_card_body::-webkit-scrollbar-track { background: #f1f1f1; }
        .msg_card_body::-webkit-scrollbar-thumb { background: #bdbdbd; border-radius: 10px; }
        .msg_card_body::-webkit-scrollbar-thumb:hover { background: #888; }
    </style>
</head>

<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-10 col-lg-8 col-xl-6 chat-container">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex bd-highlight align-items-center">
                            <div class="img_cont position-relative">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img">
                                <span class="online_icon"></span>
                            </div>
                            <div class="user_info ml-3">
                                <span>Medical Assistant</span>
                                <p>Online | Ready to help</p>
                            </div>
                        </div>
                    </div>
                    <div id="chat-body" class="card-body msg_card_body">
                        <div class="welcome-message">
                            <p><strong>Hello!</strong> I'm your AI medical assistant. Ask me about symptoms or medications.
                            <br><small>Remember, this is not a substitute for professional medical advice.</small></p>
                        </div>
                        <div class="suggestion-chips">
                            <div class="chip">Common cold symptoms</div>
                            <div class="chip">What is Paracetamol?</div>
                            <div class="chip">Headache remedies</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <form id="message-form" class="input-group">
                            <input type="text" id="message-input" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required />
                            <div class="input-group-append">
                                <button type="submit" id="send-btn" class="input-group-text send_btn">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- IMPROVEMENT: Complete JS refactor for clarity, maintainability, and modern practices --- */
        $(document).ready(function() {
            // --- Cache DOM elements for performance ---
            const chatBody = $("#chat-body");
            const messageForm = $("#message-form");
            const messageInput = $("#message-input");
            const suggestionChips = $(".suggestion-chips");

            // --- Helper function to get current time ---
            function getCurrentTime() {
                const now = new Date();
                const hours = now.getHours();
                let minutes = now.getMinutes();
                minutes = minutes < 10 ? '0' + minutes : minutes;
                return `${hours}:${minutes}`;
            }

            // --- Helper function to scroll to the bottom of the chat ---
            function scrollToBottom() {
                chatBody.scrollTop(chatBody[0].scrollHeight);
            }

            // --- Helper function to display the typing indicator ---
            function showTypingIndicator() {
                // Ensure only one typing indicator exists
                if ($("#typing-indicator").length === 0) {
                     const typingHtml = `
                        <div id="typing-indicator" class="d-flex justify-content-start mb-4 typing-indicator">
                            <div class="img_cont_msg">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg">
                            </div>
                            <div class="msg_container_bot">
                                <span></span><span></span><span></span>
                            </div>
                        </div>`;
                    chatBody.append(typingHtml);
                    $("#typing-indicator").css("display", "flex");
                    scrollToBottom();
                }
            }

            // --- Helper function to hide the typing indicator ---
            function hideTypingIndicator() {
                $("#typing-indicator").remove();
            }

            // --- Refactored function to append messages (user or bot) ---
            function appendMessage(text, sender) {
                const time = getCurrentTime();
                let messageHtml = '';

                if (sender === 'user') {
                    messageHtml = `
                        <div class="d-flex justify-content-end">
                            <div class="msg_container msg_container_send">
                                ${text}
                                <span class="msg_time msg_time_send">${time}</span>
                            </div>
                            <div class="img_cont_msg ml-2">
                                <img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg">
                            </div>
                        </div>`;
                } else {
                    messageHtml = `
                        <div class="d-flex justify-content-start">
                             <div class="img_cont_msg mr-2">
                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg">
                            </div>
                            <div class="msg_container msg_container_bot">
                                ${text}
                                <span class="msg_time msg_time_bot">${time}</span>
                            </div>
                        </div>`;
                }
                chatBody.append(messageHtml);
                scrollToBottom();
            }

            // --- Function to handle form submission ---
            function handleFormSubmit(event) {
                event.preventDefault();
                const userText = messageInput.val().trim();

                if (userText !== "") {
                    appendMessage(userText, 'user');
                    messageInput.val("");
                    getBotResponse(userText);
                }
            }

            // --- Function to get the bot's response ---
            function getBotResponse(userText) {
                showTypingIndicator();

                // Simulate network delay for a more natural feel
                setTimeout(() => {
                    $.ajax({
                        data: { msg: userText },
                        type: "POST",
                        url: "/get" // This endpoint needs to be a real, working server endpoint
                    }).done(function(data) {
                        hideTypingIndicator();
                        // The 'data' received from the server is the bot's reply
                        appendMessage(data, 'bot');
                    }).fail(function() {
                        hideTypingIndicator();
                        // IMPROVEMENT: Handle server errors gracefully
                        const errorMessage = "Sorry, I'm having trouble connecting. Please try again later.";
                        appendMessage(errorMessage, 'bot');
                    });
                }, 1200); // 1.2-second simulated delay
            }

            // --- Event Listeners ---
            
            // Handle form submission on button click
            messageForm.on("submit", handleFormSubmit);

            // NEW FEATURE: Allow sending with the "Enter" key
            messageInput.on("keydown", function(event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    messageForm.submit();
                }
            });

            // NEW FEATURE: Handle clicks on suggestion chips
            suggestionChips.on("click", ".chip", function() {
                const chipText = $(this).text();
                messageInput.val(chipText);
                messageForm.submit();
            });

            // --- Initial scroll to bottom ---
            scrollToBottom();
        });
    </script>
</body>
</html>
